<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="3"/>

  <!-- Tricolor Accent Top Arc -->
  <path d="M 96 80 Q 256 50 416 80" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Speed lines -->
  <line x1="80" y1="280" x2="130" y2="280" stroke="#FF9933" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <line x1="60" y1="310" x2="110" y2="310" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <line x1="75" y1="340" x2="125" y2="340" stroke="#138808" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- Motorcycle Silhouette Stylized -->
  <!-- Rear wheel -->
  <circle cx="165" cy="330" r="54" fill="none" stroke="#64748B" stroke-width="14"/>
  <circle cx="165" cy="330" r="32" fill="none" stroke="#FF9933" stroke-width="8"/>
  <circle cx="165" cy="330" r="12" fill="#FFFFFF"/>

  <!-- Front wheel -->
  <circle cx="355" cy="330" r="54" fill="none" stroke="#64748B" stroke-width="14"/>
  <circle cx="355" cy="330" r="32" fill="none" stroke="#138808" stroke-width="8"/>
  <circle cx="355" cy="330" r="12" fill="#FFFFFF"/>

  <!-- Bike Frame -->
  <path d="M 165 330 L 235 270 L 305 270 L 355 330" fill="none" stroke="#F8FAFC" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 235 270 L 260 210 L 330 210 L 355 330" fill="none" stroke="#F8FAFC" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Fuel Tank & Seat -->
  <path d="M 215 250 C 235 240, 275 235, 295 245 C 305 250, 310 260, 290 265 C 265 270, 225 270, 215 250 Z" fill="url(#saffronGrad)"/>

  <!-- Handlebar & Headlight Beam -->
  <line x1="325" y1="190" x2="335" y2="215" stroke="#F8FAFC" stroke-width="12" stroke-linecap="round"/>
  <path d="M 335 200 L 400 185 L 420 230 Z" fill="#FACC15" opacity="0.25"/>
  <circle cx="340" cy="205" r="9" fill="#FACC15" filter="url(#glow)"/>

  <!-- Rider Silhouette with helmet -->
  <ellipse cx="265" cy="165" rx="22" ry="24" fill="#E2E8F0"/>
  <!-- Helmet Visor -->
  <path d="M 270 160 Q 288 165 282 178 Q 272 176 270 160 Z" fill="#0EA5E9"/>
  <!-- Rider Torso leaned forward -->
  <path d="M 235 230 C 245 190, 255 185, 270 190 C 285 195, 275 235, 260 250 Z" fill="#38BDF8"/>

  <!-- Brand Typography -->
  <text x="256" y="425" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" fill="#FFFFFF" letter-spacing="2">
    BHARAT<tspan fill="#FF9933">RAIDE</tspan>
  </text>
  <text x="256" y="455" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#94A3B8" letter-spacing="4">
    INDIA'S PWA BIKE TAXI
  </text>
</svg>
