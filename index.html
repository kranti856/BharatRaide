<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <title>BharatRaide - Har Safar Desh Ke Naam</title>
    <meta name="description" content="BharatRaide Progressive Web App - India's Instant Bike Taxi & Mobility Platform. Real-time GPS tracking, 12% + ₹3 low commission, direct cash payments, and instant wallet recharge." />
    
    <!-- OpenGraph & Social Metadata -->
    <meta property="og:title" content="BharatRaide - Instant PWA Bike Taxi" />
    <meta property="og:description" content="Book affordable bike rides instantly or earn with lowest platform commissions (12% + ₹3). Install directly without app store." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BharatRaide - Har Safar Desh Ke Naam" />
    <meta name="twitter:description" content="Install BharatRaide directly from WhatsApp or Facebook groups. Fast, reliable bike taxi." />

    <!-- PWA & Mobile Web Standards -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FF9933" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BharatRaide" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Leaflet 100% Free Mapping CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Razorpay Web Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Chrome Intent Jugad (WhatsApp & Facebook In-App Browser Auto-Breakout) -->
    <script>
      (function() {
        try {
          var ua = navigator.userAgent || navigator.vendor || window.opera || '';
          var isAndroid = /android/i.test(ua);
          var isInApp = /FBAN|FBAV|Instagram|WhatsApp|Line|Messenger|MicroMessenger/i.test(ua);
          if (isAndroid && isInApp) {
            var cleanUrl = window.location.href.replace(/^https?:\/\//i, '');
            var chromeIntent = 'intent://' + cleanUrl + '#Intent;scheme=https;package=com.android.chrome;end';
            window.location.replace(chromeIntent);
          }
        } catch (err) {
          console.warn('Chrome Intent redirection bypassed:', err);
        }
      })();
    </script>
    <!-- Emergency URL Reset Handler -->
    <script>
      (function() {
        if (window.location.hash.indexOf('reset') !== -1 || window.location.search.indexOf('reset') !== -1) {
          try {
            localStorage.clear();
            sessionStorage.clear();
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(reg) { reg.unregister(); });
              });
            }
            window.location.href = window.location.origin + '/';
          } catch(e) {}
        }
      })();
    </script>
  </head>
  <body class="h-full overflow-hidden select-none touch-manipulation bg-slate-900 font-sans text-slate-100 antialiased">
    <!-- Floating Emergency Reset Button (Always 100% accessible over everything) -->
    <button
      id="emergency-reset-btn"
      onclick="localStorage.clear(); sessionStorage.clear(); if('caches' in window){caches.keys().then(function(k){k.forEach(function(c){caches.delete(c);});});} if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(sw){sw.unregister();});});} window.location.href='/';"
      style="position: fixed; top: 12px; right: 12px; z-index: 2147483647; background: #DC2626; color: #FFFFFF; font-weight: 800; font-size: 11px; padding: 6px 14px; border-radius: 9999px; border: 2px solid #FFFFFF; box-shadow: 0 4px 16px rgba(0,0,0,0.8); cursor: pointer; pointer-events: auto; display: flex; align-items: center; gap: 4px;"
    >
      ✕ रीसेट (Reset)
    </button>

    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/service-worker.js')
            .then(function(reg) {
              reg.update();
              console.log('BharatRaide Service Worker active with scope:', reg.scope);
            })
            .catch(function(err) {
              console.log('Service Worker registration skipped or failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
