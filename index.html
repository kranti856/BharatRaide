    <meta name="description" content="BharatRaide Progressive Web App - India's Instant Bike Taxi & Mobility Platform. Real-time GPS tracking, 12% + ₹3 low commission, direct cash payments, and instant wallet recharge." />
    
    <!-- OpenGraph & Social Metadata -->
    <meta property="og:title" content="BharatRaide - Instant PWA Bike Taxi" />

    <!-- PWA & Mobile Web Standards -->

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- Leaflet 100% Free Mapping CSS -->

    <!-- Razorpay Web Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Chrome Intent Jugad (WhatsApp & Facebook In-App Browser Auto-Breakout) -->
    <script>
      (function() {
        try {
          var ua = navigator.userAgent || navigator.vendor || window.opera || '';
          var isAndroid = /android/i.test(ua);
          var isInApp = /FBAN|FBAV|Instagram|WhatsApp|Line|Messenger|MicroMessenger/i.test(ua);
          if (isAndroid && isInApp) {
            var cleanUrl = window.location.href.replace(/^https?:\/\//i, '');
            var chromeIntent = 'intent://' + cleanUrl + '#Intent;scheme=https;package=com.android.chrome;end';
            window.location.replace(chromeIntent);
          }
        } catch (err) {
          console.warn('Chrome Intent redirection bypassed:', err);
        }
      })();
    </script>
  </head>
  <body class="h-full overflow-hidden select-none touch-manipulation bg-slate-900 font-sans text-slate-100 antialiased">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/service-worker.js')
            .then(function(reg) {
              console.log('BharatRaide Service Worker active with scope:', reg.scope);
            })
            .catch(function(err) {
              console.log('Service Worker registration skipped or failed:', err);
            });
        });
      }
    </script>
  </body>
